name: verificar
on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python3 scripts/verificar.py
      - run: python3 scripts/test_sello.py
      - run: python3 scripts/test_valida_grafo.py
